<title>مسار بايثون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* التخطيط: عمود واحد بعرض الهاتف؛ الرئيسية خريطة فصول على خط عمودي، والدرس شاشة واحدة بشريط سفلي ثابت */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --sunken:#E2E8F3; --line:#D3DBE9;
  --ink:#14213A; --muted:#58657E;
  --blue:#2B63A8; --blue-soft:#DCE8F8; --on-blue:#FFFFFF;
  --sun:#F5B400; --sun-soft:#FFF1C7; --sun-ink:#6B4A00;
  --ok:#17875C; --ok-soft:#D9F2E6; --bad:#C63A52; --bad-soft:#FADFE4;
  --code-bg:#101A2D; --code-fg:#E4EBF7; --code-dim:#8496B4; --code-kw:#7FB4FF; --code-str:#FFD666; --code-num:#8CE0B8; --code-line:#22304A;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1422; --surface:#152036; --sunken:#0F192B; --line:#27344E;
  --ink:#E7EDF8; --muted:#9BA9C2;
  --blue:#5A9AE6; --blue-soft:#1B2E4D; --on-blue:#081223;
  --sun:#FFC83D; --sun-soft:#3A2F10; --sun-ink:#FFDE8A;
  --ok:#3CC38F; --ok-soft:#12352A; --bad:#F0718A; --bad-soft:#3D1A24;
  --code-bg:#070D18; --code-line:#1A2740;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#152036; --sunken:#0F192B; --line:#27344E;
  --ink:#E7EDF8; --muted:#9BA9C2;
  --blue:#5A9AE6; --blue-soft:#1B2E4D; --on-blue:#081223;
  --sun:#FFC83D; --sun-soft:#3A2F10; --sun-ink:#FFDE8A;
  --ok:#3CC38F; --ok-soft:#12352A; --bad:#F0718A; --bad-soft:#3D1A24;
  --code-bg:#070D18; --code-line:#1A2740;
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
code,.ltr{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
p code,.q code,li code{background:var(--sunken);border-radius:6px;padding:1px 6px;font-size:.88em;display:inline-block;line-height:1.5}

/* أزرار */
.btn{min-height:50px;padding:0 22px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:1.05rem;
  background:var(--blue);color:var(--on-blue);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{background:var(--sunken);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sun{background:var(--sun);color:#3B2900}
.btn.wide{width:100%}
.link{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* الرئيسية */
.home{display:flex;flex-direction:column;gap:20px;padding-block:18px 48px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand h1{font-size:1.5rem;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums;font-size:.92rem}
.chip svg{flex:none}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--sun)}
.next{background:var(--blue);color:var(--on-blue);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.next small{opacity:.85;font-size:.85rem}
.next h2{font-size:1.45rem}
.next .btn{background:var(--sun);color:#3B2900;align-self:flex-start}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
.rev{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rev div{flex:1;min-width:180px}
.rev b{display:block;font-family:var(--display);font-size:1.1rem}
.rev span{color:var(--muted);font-size:.88rem}
.unit{display:flex;flex-direction:column;gap:4px}
.unit>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-block:6px}
.unit .num{font-family:var(--display);font-weight:800;color:var(--blue);font-size:.95rem;letter-spacing:.02em}
.unit h2{font-size:1.3rem}
.unit .ud{color:var(--muted);font-size:.9rem;flex-basis:100%}
.unit .cnt{margin-inline-start:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.unit.locked{opacity:.55}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;inset-block:26px;inset-inline-start:21px;width:3px;background:var(--line);border-radius:2px}
.node{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:8px 0;min-height:60px}
.node .ic{flex:none;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted);box-shadow:0 0 0 5px var(--bg);position:relative}
.node.ch .ic{border-radius:13px;transform:rotate(45deg)} .node.ch .ic svg{transform:rotate(-45deg)}
.node.done .ic{background:var(--ok);color:#fff}
.node.cur .ic{background:var(--blue);color:var(--on-blue);box-shadow:0 0 0 5px var(--bg),0 0 0 8px var(--blue-soft)}
.node .tx{min-width:0;flex:1}
.node .tx b{display:block;font-weight:600;line-height:1.4}
.node .tx span{color:var(--muted);font-size:.86rem}
.node[disabled]{cursor:default}
.node[disabled] .tx{opacity:.6}
.stars{display:flex;gap:2px;color:var(--sun);flex:none}
.stars .off{color:var(--line)}
.jump{align-self:flex-start;margin-inline-start:59px}
.note{color:var(--muted);font-size:.85rem;text-align:center}

/* الدرس */
.sess{display:flex;flex-direction:column;flex:1;min-height:100%}
.bar{display:flex;align-items:center;gap:12px;padding-block:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.prog{flex:1;height:12px;background:var(--sunken);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .35s}
.kind{font-size:.8rem;color:var(--muted);font-weight:600;flex:none}
.step{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:10px 24px;min-width:0}
.tag{font-size:.8rem;font-weight:600;color:var(--blue);letter-spacing:.02em}
.step h2{font-size:1.5rem}
.q{font-size:1.1rem;font-weight:500;line-height:1.75}
.q pre,.cmp pre{font-family:var(--mono);direction:ltr;text-align:left;background:var(--sunken);border-radius:10px;padding:8px 12px;margin:8px 0 0;font-size:.9rem;line-height:1.5;overflow-x:auto;white-space:pre}
.lead{font-size:1.02rem;max-width:62ch}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);padding:14px 16px;font-family:var(--mono);font-size:.92rem;line-height:1.75;direction:ltr;text-align:left;overflow-x:auto;white-space:pre;margin:0;tab-size:4}
.code .k{color:var(--code-kw)} .code .s{color:var(--code-str)} .code .n{color:var(--code-num)} .code .c{color:var(--code-dim);font-style:italic}
.runbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.runbox .btn{align-self:flex-start;min-height:42px;font-size:.95rem;padding:0 18px}
.term{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r);border:1px solid var(--code-line);padding:10px 14px;font-family:var(--mono);font-size:.88rem;line-height:1.65;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.term::before{content:"output";display:block;color:var(--code-dim);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.term .e{color:#FF9DB0}
.term .ar{display:block;direction:rtl;text-align:right;font-family:var(--body);color:#FFD9A0;margin-top:6px}
.term .in{color:var(--code-dim)}

.opts{display:grid;gap:10px}
.opt{background:var(--surface);border-radius:var(--r);padding:12px 16px;text-align:start;min-height:52px;box-shadow:inset 0 0 0 2px var(--line);display:block;width:100%;line-height:1.6}
.opt.mono{font-family:var(--mono);direction:ltr;text-align:left;white-space:pre-wrap;font-size:.92rem}
.opt.sel{box-shadow:inset 0 0 0 3px var(--blue);background:var(--blue-soft)}
.opt.good{box-shadow:inset 0 0 0 3px var(--ok);background:var(--ok-soft)}
.opt.wrong{box-shadow:inset 0 0 0 3px var(--bad);background:var(--bad-soft)}
.ans{width:100%;min-height:52px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:1.05rem;padding:8px 14px;direction:ltr;text-align:left}
.lines{display:flex;flex-direction:column;gap:2px;background:var(--code-bg);border-radius:var(--r);padding:8px;direction:ltr}
.ln{display:flex;gap:12px;align-items:center;text-align:left;font-family:var(--mono);font-size:.92rem;color:var(--code-fg);padding:8px 10px;border-radius:8px;white-space:pre;min-height:44px;overflow-x:auto;width:100%}
.ln i{font-style:normal;color:var(--code-dim);width:1.2em;flex:none;font-size:.8rem}
.ln.sel{background:#2B63A8;color:#fff} .ln.good{background:#17875C;color:#fff} .ln.wrong{background:#C63A52;color:#fff}
.slot{display:inline-block;min-width:3.4em;min-height:1.7em;border-radius:7px;background:var(--code-line);border:2px dashed var(--code-dim);color:var(--code-str);padding:0 8px;font-family:var(--mono);font-size:inherit;vertical-align:middle;text-align:center}
.slot.full{border-style:solid;border-color:var(--sun);color:#fff}
.bank{display:flex;flex-wrap:wrap;gap:10px;direction:ltr;justify-content:center}
.tok{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);border-radius:10px;padding:8px 16px;font-family:var(--mono);min-height:46px;font-size:.95rem;white-space:pre}
.tok.used{opacity:.3}
.build{background:var(--code-bg);border-radius:var(--r);padding:8px;min-height:64px;display:flex;flex-direction:column;gap:4px;direction:ltr}
.build:empty::before{content:"اضغط على الأسطر بالترتيب";color:var(--code-dim);font-family:var(--body);direction:rtl;padding:12px;text-align:center}
.pool{display:flex;flex-direction:column;gap:8px;direction:ltr}
.pool .tok{text-align:left;width:100%;overflow-x:auto}
.edwrap{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--code-bg);border:2px solid var(--code-line)}
.edwrap:focus-within{border-color:var(--blue)}
#ed{width:100%;border:0;resize:vertical;background:transparent;color:var(--code-fg);font-family:var(--mono);font-size:16px;line-height:1.7;padding:12px 14px;direction:ltr;text-align:left;white-space:pre;overflow-x:auto;tab-size:4;min-height:150px;outline:none}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--code-line);direction:ltr}
.keys button{flex:none;min-width:42px;height:40px;padding:0 10px;border-radius:8px;background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:.9rem}
.tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.hint{background:var(--sun-soft);color:var(--sun-ink);border-radius:var(--r);padding:10px 14px;font-size:.95rem}
.hint code{background:transparent;padding:0}

/* رسومات */
.viz{background:var(--surface);border-radius:var(--r);padding:16px;direction:ltr;overflow-x:auto;display:flex;justify-content:safe center;gap:14px;align-items:flex-end;font-family:var(--mono);font-size:.9rem}
.vcap{font-family:var(--body);direction:rtl;color:var(--muted);font-size:.8rem;text-align:center;margin-top:-8px}
.vbox{display:flex;flex-direction:column;align-items:center;flex:none}
.vbox .lab{background:var(--sun);color:#3B2900;border-radius:8px 8px 0 0;padding:1px 12px;font-weight:600;font-size:.82rem}
.vbox .val{border:3px solid var(--blue);border-radius:10px;padding:10px 18px;min-width:76px;text-align:center;background:var(--blue-soft);font-weight:600}
.vlist{display:grid;grid-auto-flow:column;grid-template-rows:auto auto auto;gap:4px 0;flex:none;align-items:center}
.vlist .nm{grid-row:2;padding-right:10px;font-weight:600;color:var(--blue)}
.vlist .hd{font-size:.72rem;color:var(--muted);text-align:center;font-family:var(--body);padding-right:10px}
.vlist .cell{grid-row:2;border:3px solid var(--blue);margin-left:-3px;min-width:46px;padding:8px 10px;text-align:center;background:var(--blue-soft);font-weight:600}
.vlist .ix{text-align:center;font-size:.78rem;color:var(--muted)}
.vlist .ix.pos{color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;margin:0 3px}
.vflow{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.vflow .cond{background:var(--sun);color:#3B2900;border-radius:999px;padding:6px 18px;font-weight:600}
.vflow .br{display:flex;gap:18px}
.vflow .arm{display:flex;flex-direction:column;align-items:center;gap:4px}
.vflow .arm b{font-size:.78rem} .vflow .t b{color:var(--ok)} .vflow .f b{color:var(--bad)}
.vflow .arm span{font-size:1.1rem;line-height:1;color:var(--muted)}
.vflow .arm div{border-radius:10px;padding:6px 12px;border:2px solid var(--line);background:var(--sunken);font-size:.82rem;white-space:nowrap}
.vflow .t div{border-color:var(--ok)} .vflow .f div{border-color:var(--bad)}
.vloop{display:flex;align-items:stretch;gap:6px;flex:none}
.vloop .it{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--sunken);animation:pulse 3.6s infinite}
.vloop .it:nth-child(3){animation-delay:1.2s} .vloop .it:nth-child(5){animation-delay:2.4s}
.vloop .it b{color:var(--blue)} .vloop .it small{font-size:.74rem;color:var(--muted);white-space:nowrap}
.vloop .ar{align-self:center;color:var(--muted)}
@keyframes pulse{0%,25%{border-color:var(--sun);background:var(--sun-soft)}33%,100%{border-color:var(--line);background:var(--sunken)}}
.vdict{display:grid;grid-template-columns:auto auto auto;gap:6px 10px;align-items:center;flex:none}
.vdict .k{background:var(--sun-soft);color:var(--sun-ink);border-radius:8px;padding:4px 12px;font-weight:600}
.vdict .v{border:3px solid var(--blue);background:var(--blue-soft);border-radius:8px;padding:4px 14px;text-align:center;font-weight:600}
.vdict .a{color:var(--muted)}
.vfunc{display:flex;align-items:center;gap:10px;flex:none}
.vfunc .io{border-radius:8px;padding:5px 12px;background:var(--sunken);border:2px solid var(--line);min-width:44px;text-align:center}
.vfunc .fn{background:var(--blue);color:var(--on-blue);border-radius:12px;padding:12px 16px;font-weight:600}
.vfunc .a{color:var(--muted)}
.vtypes{display:grid;grid-template-columns:repeat(4,auto);gap:6px 12px;flex:none;text-align:center}
.vtypes b{background:var(--blue);color:var(--on-blue);border-radius:8px;padding:2px 10px;font-size:.82rem}
.vtypes span{border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--sunken)}

/* الشريط السفلي */
.foot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);margin-top:auto}
.fb{border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-size:1.15rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.fb .ex{font-size:.95rem}
.fb code{background:transparent;padding:0}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.85rem;margin-top:4px}
.cmp pre{margin:0;background:var(--surface)}
.acts{display:flex;gap:10px}
.acts .btn{flex:1}
.acts .btn.ghost{flex:0 1 auto}

/* شاشة النهاية */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:40px}
.end h2{font-size:2rem}
.end .big{display:flex;gap:8px;color:var(--sun)} .end .big .off{color:var(--line)}
.end .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.end .stat{background:var(--surface);border-radius:var(--r);padding:12px 20px;min-width:110px}
.end .stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.end .stat span{color:var(--muted);font-size:.85rem}
.end p{color:var(--muted);max-width:42ch}
@media (min-width:560px){ .opts.two{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>
(function(){
'use strict';
document.documentElement.lang='ar'; document.documentElement.dir='rtl';
const app=document.getElementById('app');
const $=s=>app.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR_N=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن'];

/* ───── المنهج ───── */
const ALL=[], STEPS={};
COURSE.forEach((u,ui)=>u.l.forEach(l=>{ l.u=u; l.ui=ui; ALL.push(l); l.s.forEach((st,i)=>{ if(st.t!=='info') STEPS[l.id+'s'+i]={st,l}; }); }));

/* ───── الحالة والحفظ ───── */
const KEY='pypath.v1';
let S={xp:0,streak:0,last:0,done:{},ex:{}};
const clean=o=>({xp:+o.xp||0,streak:+o.streak||0,last:+o.last||0,done:Object.assign({},o.done),ex:JSON.parse(JSON.stringify(o.ex||{}))});
try{ const raw=localStorage.getItem(KEY); if(raw) S=clean(JSON.parse(raw)); }catch(e){}
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
function merge(a,b){
  const m=clean(a);
  for(const k in b.done) m.done[k]=Math.max(m.done[k]||0,b.done[k]||0);
  for(const k in b.ex){ const x=m.ex[k], y=b.ex[k]; if(!x||(y.d||0)>(x.d||0)) m.ex[k]={b:y.b||0,d:y.d||0}; }
  m.xp=Math.max(a.xp,b.xp);
  if(b.last>a.last){m.last=b.last;m.streak=b.streak;} else if(b.last===a.last) m.streak=Math.max(a.streak,b.streak);
  return m;
}
let ref=null, remote=null, writing=false, dirty=false, sync='local', pushT=0;
function setSync(s){ sync=s; const el=document.getElementById('sync'); if(el) el.innerHTML=syncHtml(); }
function syncHtml(){
  const m={ok:['ok','التقدم محفوظ على حسابك ويتزامن بين أجهزتك'],wait:['wait','جارٍ جلب تقدمك…'],slow:['wait','تعذّر الوصول إلى الحفظ السحابي الآن. تقدمك محفوظ على هذا الجهاز'],local:['','التقدم محفوظ على هذا الجهاز']}[sync];

async function initSync(){

}

    } else if(st.t==='order'){
      h+='<div class="build">'+ui.ord.map((li,k)=>`<button class="ln" data-act="unord" data-i="${k}" ${L?'disabled':''}><i>${k+1}</i><span>${hl(st.lines[li])}</span></button>`).join('')+'</div>';
      h+='<div class="pool">'+ui.pool.filter(li=>!ui.ord.includes(li)).map(li=>`<button class="tok" data-act="ord" data-i="${li}" ${L?'disabled':''}>${hl(st.lines[li])}</button>`).join('')+'</div>';
    } else if(st.t==='code'){
      const t0=st.tests[0];
      if(t0.pre) h+=`<pre class="code">${hl(t0.pre)}  <span class="c"># جاهز مسبقاً</span></pre>`;
      const rows=Math.max(6,(st.start||'').split('\n').length+2);
      h+=`<div class="edwrap"><textarea id="ed" rows="${rows}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="محرر الكود" placeholder="# اكتب الكود هنا">${esc(st.start||'')}</textarea><div class="keys" id="keys">`+
        [['⇥','    ',''],['( )','(',')'],['" "','"','"'],[':',':',''],['=',' = ',''],['[ ]','[',']'],['_','_',''],['{ }','{','}'],['#','# ',''],['<','<',''],['>','>',''],['%',' % ',''],["' '","'","'"]].map(k=>`<button type="button" data-act="key" data-a="${esc(k[1])}" data-b="${esc(k[2])}" tabindex="-1">${esc(k[0])}</button>`).join('')+`</div></div><div id="term"></div><div class="tools" id="tools"></div>`;
    }
  }
  el.innerHTML=h;
  if(st.t==='type'){ const a=$('#ans'); a.addEventListener('input',()=>{ if(ui.note){ui.note='';} foot(); }); a.addEventListener('keydown',e=>{ if(e.key==='Enter'&&a.value.trim()&&!ui.checked) check(); }); if(L){a.value=ui.typed;a.disabled=true;} }
  if(st.t==='code'){ bindEditor(); tools(); }
}
function tools(){
  const {st}=cur(), el=$('#tools'); if(!el) return;
  let h='';
  if(session.kind!=='jump'){
    if(ui.hint) h+=`<div class="hint" style="flex-basis:100%">${hl(st.hint||'').replace(/\n/g,' ')}</div>`;
    else if(st.hint) h+='<button class="link" data-act="hint">أعطني تلميحاً</button>';
    if(ui.tries>=2&&!ui.sol&&!ui.checked) h+='<button class="link" data-act="sol">أظهر الحل</button>';
  }
  el.innerHTML=h;
}
function foot(){
  const {st}=cur(), el=$('#foot'); let h='';
  if(st.t==='info'){ el.innerHTML='<div class="acts"><button class="btn wide" data-act="next">فهمت، التالي</button></div>'; return; }
  if(ui.checked){
    h+=`<div class="fb ${ui.ok?'ok':'no'}" role="status"><b>${ui.ok?(ui.sol?'يعمل. سنعيده عليك في المراجعة':'صحيح'):'ليست هذه'}</b>${ui.fb?`<div>${ui.fb}</div>`:''}${st.x?`<div class="ex">${st.x}</div>`:''}</div>`;
    const failJump=session.kind==='jump'&&session.mistakes>=2;
    h+=`<div class="acts"><button class="btn wide" data-act="${failJump?'jumpfail':'next'}">متابعة</button></div>`;
  } else if(st.t==='code'){
    if(ui.fb) h+=`<div class="fb no" role="status"><b>لم ينجح بعد</b><div>${ui.fb}</div></div>`;
    const failJump=session.kind==='jump'&&session.mistakes>=2;
    h+=failJump?'<div class="acts"><button class="btn wide" data-act="jumpfail">متابعة</button></div>':
      `<div class="acts"><button class="btn ghost" data-act="run" ${ui.busy?'disabled':''}>${I.play} شغّل</button><button class="btn" data-act="check" ${ui.busy?'disabled':''}>${ui.busy?'جارٍ الفحص…':'تحقق'}</button></div>`;
  } else {
    const ready=st.t==='mc'||st.t==='bug'?ui.sel!=null:st.t==='type'?!!($('#ans')&&$('#ans').value.trim()):st.t==='fill'?ui.fill.every(x=>x!=null):ui.ord.length===st.lines.length;
    if(ui.note) h+=`<div class="hint" role="status">${ui.note}</div>`;
    h+=`<div class="acts"><button class="btn wide" data-act="check" ${ready?'':'disabled'}>تحقق</button></div>`;
  }
  el.innerHTML=h;
}
const nt=s=>String(s).replace(/[\s"'“”‘’]/g,'');
function check(){
  const {st}=cur(); let ok=false, fb='';
  if(st.t==='code') return checkCode();
  if(st.t==='mc'||st.t==='bug') ok=ui.sel===st.a;
  else if(st.t==='type'){ ui.typed=$('#ans').value; ok=nt(ui.typed)===nt(st.a);
    if(!ok&&nt(ui.typed).toLowerCase()===nt(st.a).toLowerCase()){ ui.note='قريب جداً. الأحرف صحيحة لكن انتبه للحرف الكبير والصغير: بايثون يعرض النص كما كُتب تماماً. عدّل إجابتك.'; foot(); $('#ans').focus(); return; } if(!ok) fb=`الناتج الصحيح: <code>${esc(st.a)}</code>`; }
  else if(st.t==='fill'){ ok=st.a.every((a,i)=>st.bank[ui.fill[i]]===a); if(!ok) fb=`الصحيح: <code>${esc(st.a.join(' , '))}</code>`; }
  else if(st.t==='order'){ ok=ui.ord.map(i=>st.lines[i]).join('\n')===st.lines.join('\n'); if(!ok) fb=`<pre class="code" style="margin-top:6px">${hl(st.lines.join('\n'))}</pre>`; }
  done(ok,fb);
}
function done(ok,fb){
  const c=cur(); ui.checked=true; ui.ok=ok; ui.fb=fb||''; snd(ok?'ok':'bad');
  record(c.id,ok);
  if(ok) session.cleared++; else { session.mistakes++; if(session.kind!=='jump') session.queue.push({st:c.st,id:c.id}); }
  body(); foot();
}
async function checkCode(){
  const c=cur(), st=c.st, src=fixQuotes($('#ed').value);
  ui.busy=true; ui.fb=''; foot();
  const r=await judge(st,src);
  ui.busy=false; snd(r.ok?'ok':'bad');
  if(r.ok){ ui.checked=true; ui.ok=true; record(c.id,!ui.failed&&!ui.sol); session.cleared++; $('#ed').readOnly=true; }
  else { ui.tries++; ui.fb=r.msg; if(!ui.failed){ ui.failed=true; session.mistakes++; record(c.id,false); } }
  tools(); foot();
}
async function runDemo(code,inputs,shift){
  const t=$('#term'); if(!t) return;
  t.innerHTML='<pre class="term">…</pre>';
  const r=await runPy(code,inputs);
  const inNote=inputs&&inputs.length?`<span class="in">input: ${esc(inputs.join(', '))}\n</span>`:'';
  if($('#term')) $('#term').innerHTML=`<pre class="term">${inNote}${esc(r.out)||(r.err?'':'<span class="in">(لا يوجد ناتج)</span>')}${r.err?errHtml(r.err,shift):''}</pre>`;
}
function next(){
  session.pos++;
  if(session.pos>=session.queue.length) return finish();
  step();
}
function bump(){ const t=today(); if(S.last===t) return; S.streak=S.last===t-1?S.streak+1:1; S.last=t; }
function finish(){
  const s=session; let title='', sub='', st=0, xp=0;
  if(s.kind==='lesson'){
    st=s.mistakes===0?3:s.mistakes<=2?2:1; const first=!isDone(s.lesson.id);
    xp=(first?10:4)+(st===3?5:0)+(s.lesson.ch?10:0);
    S.done[s.lesson.id]=Math.max(S.done[s.lesson.id]||0,st);
    title=s.lesson.ch?'أنهيت التحدي':'أنهيت الدرس';
    sub=st===3?'بدون أي خطأ.':'التمارين التي أخطأت فيها ستعود إليك في المراجعة حتى تثبت.';
  } else if(s.kind==='review'){ xp=5+(s.mistakes===0?3:0); title='انتهت المراجعة'; sub=s.mistakes?'ما أخطأت فيه سيعود غداً، والباقي بعد أيام.':'كلها صحيحة. ستعود هذه التمارين بعد فترة أطول.'; }
  else { s.unit.l.forEach(l=>{ if(!isDone(l.id)) S.done[l.id]=1; }); xp=25; title='تجاوزت الفصل'; sub=`فصل «${s.unit.t}» صار مفتوحاً كله. يمكنك العودة إلى أي درس فيه متى شئت.`; }
  S.xp+=xp; bump(); save(); snd('win');
  app.innerHTML=`<div class="end"><div class="big">${s.kind==='lesson'?stars(st,44):`<span>${I.star(56)}</span>`}</div><h2>${title}</h2><p>${esc(sub)}</p><div class="stats"><div class="stat"><b class="ltr">+${xp}</b><span>XP</span></div><div class="stat"><b class="ltr">${S.streak}</b><span>يوم متتالٍ</span></div><div class="stat"><b class="ltr">${s.mistakes}</b><span>أخطاء</span></div></div><button class="btn" data-act="home">متابعة</button></div>`;
  session=null; window.scrollTo(0,0);
}
function jumpFail(){
  const u=session.unit; session=null;
  app.innerHTML=`<div class="end"><h2>ليس بعد</h2><p>في فصل «${esc(u.t)}» نقاط تحتاج مراجعة. الدروس قصيرة، وما تعرفه منها ستنهيه بسرعة.</p><button class="btn" data-act="home">العودة إلى الدروس</button></div>`;
}

/* ───── محرر الكود ───── */
function insert(ta,a,b){ const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value; ta.value=v.slice(0,s)+a+v.slice(s,e)+(b||'')+v.slice(e); ta.selectionStart=ta.selectionEnd=s+a.length+(e-s); }
function bindEditor(){
  const ta=$('#ed'); if(!ta) return;
  const nl=()=>{ const s=ta.selectionStart, line=ta.value.slice(0,s).split('\n').pop(); let ind=line.match(/^ */)[0]; if(/:\s*$/.test(line)) ind+='    '; insert(ta,'\n'+ind,''); };
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault(); insert(ta,'    ',''); }
    else if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); nl(); }
    else if(e.key==='Backspace'&&ta.selectionStart===ta.selectionEnd){ const s=ta.selectionStart, line=ta.value.slice(0,s).split('\n').pop(); if(line.length&&/^ +$/.test(line)&&line.length%4===0){ e.preventDefault(); ta.value=ta.value.slice(0,s-4)+ta.value.slice(s); ta.selectionStart=ta.selectionEnd=s-4; } }
  });
  ta.addEventListener('beforeinput',e=>{ if(e.inputType==='insertLineBreak'){ e.preventDefault(); nl(); } });
  $('#keys').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
}

/* ───── الصوت ───── */
let sndOn=true, actx=null;
try{ sndOn=localStorage.getItem('pypath.snd')!=='0'; }catch(e){}
function tone(f,t0,d,v,type){ const o=actx.createOscillator(), g=actx.createGain(); o.type=type||'sine'; o.frequency.value=f; const t=actx.currentTime+t0; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
function snd(k){
  if(!sndOn) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!actx) actx=new AC(); if(actx.state==='suspended') actx.resume();
    if(k==='tap') tone(520,0,0.05,0.07,'triangle');
    else if(k==='ok'){ tone(660,0,0.12,0.12); tone(990,0.09,0.2,0.12); }
    else if(k==='bad'){ tone(220,0,0.16,0.1,'triangle'); tone(165,0.12,0.24,0.1,'triangle'); }
    else if(k==='win'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.26,0.11)); }
  }catch(e){}
}

/* ───── الأحداث ───── */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.dataset.act!=='check') snd('tap');
  const act=b.dataset.act, i=+b.dataset.i, st=session&&cur()?cur().st:null;
  switch(act){
    case 'lesson': startLesson(b.dataset.id); break;
    case 'review': startReview(); break;
    case 'jump': startJump(b.dataset.id); break;
    case 'home': case 'quit': home(); break;
    case 'jumpfail': jumpFail(); break;
    case 'snd': sndOn=!sndOn; try{localStorage.setItem('pypath.snd',sndOn?'1':'0');}catch(e){} snd('tap'); home(); break;
    case 'next': if(st.t==='info') session.cleared++; next(); break;
    case 'sel': ui.sel=i; body(); foot(); break;
    case 'fillt': { const k=ui.fill.indexOf(null); if(k>=0){ui.fill[k]=i; body(); foot();} break; }
    case 'unfill': ui.fill[i]=null; body(); foot(); break;
    case 'ord': ui.ord.push(i); body(); foot(); break;
    case 'unord': ui.ord.splice(i,1); body(); foot(); break;
    case 'check': check(); break;
    case 'demo': runDemo(st.code,st.inp,0); break;
    case 'run': { const t=st.tests[0]; runDemo(build(t,fixQuotes($('#ed').value)),t.in,preLines(t)); break; }
    case 'hint': ui.hint=true; tools(); break;
    case 'sol': ui.sol=true; $('#ed').value=st.sol; tools(); break;
    case 'key': { const ta=$('#ed'); ta.focus(); insert(ta,b.dataset.a,b.dataset.b); break; }
  }
});

window.__py={judge,runPy,norm};
home();
initSync();
setTimeout(()=>{ loadPy().catch(()=>{}); },800);
})();
</script>
